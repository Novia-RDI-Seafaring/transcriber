name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Bundle frontend into package
        run: |
          mkdir -p src/transcriber/web
          cp -R web/dist src/transcriber/web/dist
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel and sdist
        run: uv build
      - name: Check the wheel contains the frontend
        run: unzip -l dist/*.whl | grep -q "transcriber/web/dist/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # PyPI trusted publishing: configure this repo + workflow + environment
    # at https://pypi.org/manage/project/dialogue-transcriber/settings/publishing/
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
