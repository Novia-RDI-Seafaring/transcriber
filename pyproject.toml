[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dialogue-transcriber"
version = "0.1.0"
description = "Transcribe interviews and panel discussions, identify who said what via speaker-embedding clustering, and relabel speakers in an interactive web UI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Christoffer Björkskog" },
    { name = "Novia University of Applied Sciences, RDI Seafaring" },
]
keywords = [
    "transcription",
    "whisper",
    "speaker-diarization",
    "speaker-identification",
    "interview",
    "dialogue",
    "panel-discussion",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
local = ["faster-whisper>=1.0"]
embed = ["nemo-toolkit[asr]>=1.23", "torch>=2.2", "torchaudio>=2.2"]
cluster = ["scikit-learn>=1.4", "umap-learn>=0.5"]
youtube = ["yt-dlp>=2024.4.0"]
ui = [
    "dash>=2.16",
    "plotly>=5.20",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
oip = ["mcp>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
all = [
    "dialogue-transcriber[openai,local,embed,cluster,youtube,ui,api,oip]",
]

[project.scripts]
transcriber = "transcriber.cli:app"
dialogue-transcriber = "transcriber.cli:app"
transcriber-mcp = "transcriber.oip.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Novia-RDI-Seafaring/transcriber"
Repository = "https://github.com/Novia-RDI-Seafaring/transcriber"
Issues = "https://github.com/Novia-RDI-Seafaring/transcriber/issues"

# The built React frontend is copied to src/transcriber/web/dist before a
# release build (see .github/workflows/release.yml); it is gitignored, so it
# must be declared as an artifact — at build level, since the wheel is built
# from the sdist and would otherwise lose it.
[tool.hatch.build]
artifacts = ["src/transcriber/web/"]

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: marks tests as slow (heavy models, network)",
    "gpu: marks tests requiring a GPU",
    "network: marks tests requiring network access",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
